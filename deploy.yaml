name: Deploy Resume Updates

on:
  push:
    paths:
      - 'Resume.pdf'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install PDF Parsing Dependencies
        run: npm install pdf-parse

      - name: Execute Resume Parser Script
        run: node parse_resume.js

      - name: Commit Updated data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "auto: parse Resume.pdf and regenerate data.json" || exit 0
          git push